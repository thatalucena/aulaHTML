<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário HTML</title>
    <link rel="stylesheet" href="../styles/formulario.css">
    <!-- <style>
        label {
            display: block;
        }
    </style> -->
</head>
<body>
    <h1>Cadastro</h1>
    <form>
        <div>
            <label class="block" for="nome">Nome</label>
            <input type="text" name="nome" id="nome" required placeholder="Seu nome">
        </div>
        <div>
            <label class="block" for="email">Email</label>
            <input type="email" name="email" id="email" required placeholder="Seu melhor email">
        </div>
        <div>
            <label class="block" for="senha">Senha</label>
            <input type="password" name="senha" id="senha" required placeholder="Crie sua senha">
        </div>
        <div>
            <label class="block" for="nasc">Data de nascimento</label>
            <input type="date" name="nasc" id="nasc">
        </div>
        <div>
            <legend>Qual o seu nível?</legend>
            <div>
                <input type="radio" name="nivel" id="jr" value="junior">
                <label for="jr">Junior</label>
            </div>
            <div>
                <input type="radio" name="nivel" id="pl" value="pleno">
                <label for="pl">Pleno</label>
            </div>
            <div>
                <input type="radio" name="nivel" id="sr" value="senior">
                <label for="sr">Senior</label>
            </div>
            <div>
                <input type="radio" name="nivel" id="outro" value="outro">
                <label for="outro">Outro</label>
                <div>
                    <label for="observacao">Em caso de outro, específique:</label>
                    <textarea class="block" name="observacao" id="observacao" maxlength="20"></textarea>
                 </div>
            </div>
        <div>
            <legend>Qual a sua stack?</legend>
            <div>
                <input type="checkbox" name="stack" id="html" value="html">
                <label for="html">HTML</label>
            </div>
            <div>
                <input type="checkbox" name="stack" id="css" value="css">
                <label for="css">CSS</label>
            </div>
            <div>
                <input type="checkbox" name="stack" id="js" value="javascript">
                <label for="js">JavaScript</label>
            </div>
        </div>
        <button>Cadastrar</button>
    </form>
</body>
</html>
